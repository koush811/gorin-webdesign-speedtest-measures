<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .items{
        display: flex;
        gap: 30px;
        margin: 10px;
    }
    .item{
        width: 30px;
        height: 30px;
        background-color: red;
        border-radius: 10px;
    }

    .item.active{
        animation: rotate 2s ;
    }

    @keyframes rotate{
        to{
            transform: rotate(360deg);
        }
    }
</style>
<body>
    
    <div class="items">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
    <button id="start">START</button>
</body>
<script src="script.js"></script>
</html>
