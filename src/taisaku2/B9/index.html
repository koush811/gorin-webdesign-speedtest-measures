<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #result{
        display: none;
    }
    #question{
        display: none;
    }
    #question.active{
        display: block;
    }
    #result.active{
        display: block;
    }
</style>
<body>
    <div id="question">
        <div id="qnum"></div>
        <div id="qtext"></div>
        <input type="number">
        <button id="qbtn">回答</button>
    </div>

    <div id="result">
        <div id="rnum"></div>
        <button id="restart">リスタート</button>
    </div>
</body>
<script src="script.js"></script>
</html>
