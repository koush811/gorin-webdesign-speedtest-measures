<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .img{
            width: 100px;
            height: 100px;
            background-color: gray;
            margin: 10px;
            position: relative;
            
        }

        .img::after{
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
        }

        .img:nth-of-type(1):hover::after{
            content: "A";
            opacity: 1;
        }

        .img:nth-of-type(2):hover::after{
            content: "B";
            opacity: 1;
        }

        .img:nth-of-type(3):hover::after{
            content: "C";
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="img"></div>
    <div class="img"></div>
    <div class="img"></div>
</body>
</html>
